name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test
        run: pytest

      - name: Build
        run: pyinstaller badminton_bot/main.py --name BadmintonBot --windowed --paths . --collect-all selenium -y

      - name: Zip (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/BadmintonBot.app BadmintonBot-macOS.zip

      - name: Zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/BadmintonBot -DestinationPath BadmintonBot-Windows.zip

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: BadmintonBot-*.zip
          body: |
            使用說明請見 [README](https://github.com/Ta-Wei-Liao/badminton_bot#readme)。
            第一次開啟會被系統擋下（未簽章），README 內有放行步驟。
